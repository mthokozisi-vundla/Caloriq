<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>


```
<title>Caloriq</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="header">
  <h1>Caloriq</h1>
  <p>Your daily nutrition dashboard</p>
</div>

<div class="dashboard">
  <!-- Calories -->
  <div class="dashboard-card">
    <h2>Today's Calories</h2>
    <div class="main-stat">
      <strong id="calories-target">0</strong>
      <span>Target kcal</span>
    </div>
    <div class="stat">
      <span>Consumed</span>
      <strong id="calories-consumed">0</strong>
    </div>
    <div class="stat">
      <span>Remaining</span>
      <strong id="calories-remaining">0</strong>
    </div>
  </div>

  <!-- Protein -->
  <div class="dashboard-card">
    <h2>Protein</h2>
    <div class="main-stat">
      <strong id="protein-consumed">0</strong>
      <span>grams</span>
    </div>
  </div>

  <!-- Weight -->
  <div class="dashboard-card">
    <h2>Weight</h2>
    <div class="weight-stats">
      <div class="stat">
        <span>Starting</span>
        <strong id="weight-starting">0 kg</strong>
      </div>
      <div class="stat">
        <span>Current</span>
        <strong id="weight-current">0 kg</strong>
      </div>
      <div class="stat">
        <span>Change</span>
        <strong id="weight-change">0 kg</strong>
      </div>
    </div>
  </div>

  <div class="dashboard-card">
  <h2>Update Weight</h2>
  <form id="weight-form">
    <label for="weight-input">Enter current weight (kg):</label>
    <input type="number" id="weight-input" step="0.1" required>
    <button type="submit">Save</button>
  </form>
  <p id="weight-status"></p>
</div>

  <!-- Today's Food -->
  <div class="dashboard-card">
    <h2>Today's Food</h2>
    <div id="food-entries"></div>
  </div>
</div>

</main>

<script src="script.js"></script>
```

</body>
</html>
